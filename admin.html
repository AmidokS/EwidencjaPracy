<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f5faf7">
  <title>Коды доступа</title>
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { overflow-y: auto; }
    .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 40px; display: flex; flex-direction: column; gap: 12px; }
    .person { background: var(--card); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .person .top { display: flex; align-items: center; gap: 10px; }
    .person .name { font-weight: 700; font-size: 17px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .person .code { font: 650 18px var(--rounded); letter-spacing: .08em; }
    .person .note { font-size: 14px; background: var(--card-hi); border-radius: 10px; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .tag.ok { background: var(--pc); color: var(--on-pc); }
    .tag.wait { background: var(--card-hi); color: var(--text2); }
    .tag.off { background: var(--error-bg); color: var(--error); }
    .tag.own { background: var(--sc); color: var(--on-sc); }
    .meta { font-size: 13px; color: var(--text2); line-height: 1.5; }
    .warn { color: var(--error); font-weight: 600; }
    .acts { display: flex; flex-wrap: wrap; gap: 8px; }
    .acts button { border: 0; border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; background: var(--sc); color: var(--on-sc); }
    .acts button.danger { background: var(--error-bg); color: var(--error); }
    .err { color: var(--error); font-weight: 600; font-size: 14px; margin: 0; min-height: 18px; }
    .check { display: flex; align-items: center; gap: 10px; font-size: 15px; }
    .check input { width: 20px; height: 20px; accent-color: var(--primary); }
    .newcode { background: var(--pc); color: var(--on-pc); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .newcode .big { font-size: 30px; letter-spacing: .1em; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .stat { background: var(--card); border-radius: 16px; padding: 10px 8px; text-align: center; }
    .stat b { display: block; font: 700 22px var(--rounded); }
    .stat span { font-size: 12px; color: var(--text2); }
    details.card > summary { cursor: pointer; font-weight: 700; font-size: 17px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::after { content: '▾'; color: var(--text2); }
    details.card[open] > summary::after { content: '▴'; }
    .set { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--card-hi); margin-top: 12px; }
    .set h4 { margin: 0; font-size: 15px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .small { font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap" id="root"></div>
  <div id="toast" role="status"></div>
  <script src="config.js"></script>
  <script>
  'use strict';
  const API = (window.AUTH_API || '').replace(/\/+$/, '');
  const APP_LINK = new URL('./', location.href).href;
  const APK_LINK = APP_LINK + 'EwidencjaPracy.apk';
  const root = document.getElementById('root');
  let pass = sessionStorage.getItem('admin-pass') || '';
  let items = [];
  let cfg = null;
  let created = null;
  let query = '';
  let settingsOpen = false;

  // Тема как в приложении
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.dark = dark ? '1' : '0';

  const DAY = 86400000;
  const p2 = (n) => String(n).padStart(2, '0');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const when = (ms) => {
    if (!ms) return '—';
    const d = new Date(ms);
    return `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  };
  const dateOnly = (ms) => { const d = new Date(ms); return `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()}`; };
  const isoDate = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };
  /** Конец выбранного дня (код действует весь этот день). */
  const endOfDay = (y, m, d) => new Date(y, m - 1, d, 23, 59, 59).getTime();
  function parseDate(s) {
    s = String(s || '').trim();
    let m = /^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})$/.exec(s);
    if (m) return endOfDay(+m[3], +m[2], +m[1]);
    m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (m) return endOfDay(+m[1], +m[2], +m[3]);
    return null;
  }
  const ago = (ms) => {
    if (!ms) return '';
    const d = Math.floor((Date.now() - ms) / DAY);
    return d <= 0 ? ' (сегодня)' : d === 1 ? ' (вчера)' : ` (${d} дн. назад)`;
  };
  const kb = (n) => (n < 1024 ? `${n} Б` : `${Math.round(n / 1024)} КБ`);
  const PLATFORM = { android: 'Android (APK)', ios: 'iPhone', 'web-android': 'Android (браузер)', web: 'Браузер' };

  function toast(text) {
    const el = document.getElementById('toast');
    el.textContent = text; el.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 1800);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); } catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e2) { /* ignore */ } ta.remove();
    }
    toast('Скопировано');
  }
  const invite = (it) =>
    `Привет! Вот приложение для учёта работы (точки, Жабка, отчёты):\n${APP_LINK}\n\n` +
    `Твой личный код доступа: ${it.code}\n\n` +
    `На iPhone: открой ссылку в Safari → ••• → «Поделиться» → «На экран „Домой“».\n` +
    `На Android: установи файл EwidencjaPracy.apk, который я пришлю отдельно (или открой ссылку в Chrome → ⋮ → «Установить приложение»).\n` +
    `Код работает только на одном телефоне — никому его не передавай.`;

  async function call(path, method = 'GET', data) {
    const res = await fetch(API + path, {
      method,
      headers: { 'Authorization': `Bearer ${pass}`, 'Content-Type': 'application/json' },
      body: data ? JSON.stringify(data) : undefined,
      cache: 'no-store',
    });
    const j = await res.json().catch(() => ({}));
    if (res.status === 401) { const e = new Error('unauthorized'); e.code = 401; throw e; }
    if (!res.ok || j.ok === false) throw new Error(j.error || 'error');
    return j;
  }

  function renderLogin(msg) {
    root.innerHTML = `
      <h1 class="page-title">Коды доступа</h1>
      ${!API ? `<p class="err">В файле config.js не указан адрес сервера.</p>` : ''}
      <section class="card">
        <p class="muted">Страница управления доступом к приложению. Введи пароль администратора.</p>
        <input class="field" id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
        <p class="err" id="err">${esc(msg || '')}</p>
        <button class="btn primary" id="login">Войти</button>
      </section>`;
    const go = async () => {
      pass = document.getElementById('pw').value;
      try { await load(); sessionStorage.setItem('admin-pass', pass); }
      catch (e) { renderLogin(e.code === 401 ? 'Неверный пароль' : 'Нет связи с сервером'); }
    };
    document.getElementById('login').onclick = go;
    document.getElementById('pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  async function load() {
    const r = await call('/admin/list');
    items = r.items || [];
    cfg = r.cfg || null;
    render();
  }

  const isExpired = (it) => !!it.expires && Date.now() > it.expires;
  function status(it) {
    if (it.owner) return '<span class="tag own">Владелец</span>';
    if (!it.active) return '<span class="tag off">Отключён</span>';
    if (isExpired(it)) return '<span class="tag off">Срок истёк</span>';
    if (!it.device) return '<span class="tag wait">Не активирован</span>';
    return '<span class="tag ok">Активен</span>';
  }

  function personHtml(it) {
    const tries = it.attempts || [];
    const where = it.platform ? `${PLATFORM[it.platform] || esc(it.platform)}${it.version ? `, версия ${esc(it.version)}` : ''}` : '—';
    const old = cfg && cfg.apk && cfg.apk.name && it.platform === 'android' && it.version && it.version !== cfg.apk.name;
    return `<div class="person">
      <div class="top"><span class="name">${esc(it.name)}</span>${status(it)}</div>
      <div class="code">${esc(it.code)}</div>
      ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
      <div class="meta">
        Телефон: ${it.device ? 'привязан' : 'нет'} · ${where}${old ? ' <span class="warn">— старая версия</span>' : ''}<br>
        Последний вход: ${when(it.lastSeen)}${ago(it.lastSeen)}<br>
        Создан: ${when(it.created)} · Активирован: ${when(it.activated)}<br>
        Срок: ${it.expires ? `до ${dateOnly(it.expires)}` : 'без срока'}
        ${it.backup ? `<br>Копия записей на сервере: ${when(it.backup.at)} (${kb(it.backup.size || 0)})` : ''}
        ${tries.length ? `<br><span class="warn">Попытки войти с другого телефона: ${tries.length} (последняя ${when(tries[0].at)})</span>` : ''}
      </div>
      <div class="acts">
        <button data-a="invite" data-c="${esc(it.code)}">Копировать приглашение</button>
        <button data-a="rename" data-c="${esc(it.code)}">Переименовать</button>
        <button data-a="note" data-c="${esc(it.code)}">Заметка</button>
        ${it.owner ? '' : `<button data-a="expires" data-c="${esc(it.code)}">Срок</button>`}
        <button data-a="regen" data-c="${esc(it.code)}">Сменить код</button>
        ${it.owner ? '' : (it.active
          ? `<button class="danger" data-a="disable" data-c="${esc(it.code)}">Отключить</button>`
          : `<button data-a="enable" data-c="${esc(it.code)}">Включить</button>`)}
        ${it.device ? `<button data-a="unbind" data-c="${esc(it.code)}">Отвязать телефон</button>` : ''}
        ${it.owner ? '' : `<button class="danger" data-a="delete" data-c="${esc(it.code)}">Удалить</button>`}
      </div>
    </div>`;
  }

  function listHtml() {
    const q = query.trim().toLowerCase();
    const shown = q ? items.filter((it) => [it.name, it.note, it.code].some((v) => String(v || '').toLowerCase().includes(q))) : items;
    if (!items.length) return '<p class="muted">Пока нет ни одного кода. Создай сначала код для себя.</p>';
    if (!shown.length) return '<p class="muted">Никого не найдено.</p>';
    return shown.map(personHtml).join('');
  }

  function settingsHtml() {
    const c = cfg || { msg: null, apk: { code: 0, name: '', url: '' }, minApk: 0, offlineDays: 7, tg: { token: false, linked: false } };
    const tg = c.tg || {};
    return `<details class="card" id="settings" ${settingsOpen ? 'open' : ''}>
      <summary>Общие настройки</summary>

      <div class="set">
        <h4>Объявление для всех</h4>
        <p class="muted small">Текст появится сверху в приложении у каждого. Человек может закрыть его крестиком.</p>
        <textarea class="field" id="msg" rows="3" maxlength="500" placeholder="Например: вышла новая версия, обновитесь">${esc(c.msg ? c.msg.text : '')}</textarea>
        <div class="btn-row">
          <button class="btn primary" data-s="msg-save">Показать всем</button>
          ${c.msg ? '<button class="btn tonal" data-s="msg-clear">Убрать</button>' : ''}
        </div>
      </div>

      <div class="set">
        <h4>Обновление Android (APK)</h4>
        <p class="muted small">Когда выйдет новая версия: загрузи файл в папку web на GitHub и впиши её номер здесь. У всех с APK появится кнопка «Обновить».
          ${c.apk && c.apk.name ? `<br>Сейчас: версия ${esc(c.apk.name)} (номер ${c.apk.code})` : ''}</p>
        <div class="two">
          <div><label class="lbl">Версия</label><input class="field" id="apk-name" placeholder="1.6" value="${esc(c.apk.name || '')}"></div>
          <div><label class="lbl">Номер версии</label><input class="field" id="apk-code" inputmode="numeric" placeholder="7" value="${c.apk.code || ''}"></div>
        </div>
        <label class="lbl">Ссылка на файл</label>
        <input class="field" id="apk-url" value="${esc(c.apk.url || APK_LINK)}">
        <label class="check"><input type="checkbox" id="apk-force" ${c.minApk && c.minApk >= c.apk.code && c.apk.code ? 'checked' : ''}> Обязательное обновление (старая версия не откроется, пока не обновят)</label>
        <button class="btn primary" data-s="apk-save">Сохранить</button>
      </div>

      <div class="set">
        <h4>Работа без интернета</h4>
        <p class="muted small">Сколько дней приложение работает без связи с сервером. Потом попросит подключиться к интернету — так отключённый человек не сможет просто держать интернет выключенным. 0 — без ограничения.</p>
        <div class="two">
          <input class="field" id="offline" inputmode="numeric" value="${c.offlineDays ?? 7}">
          <button class="btn primary" data-s="offline-save">Сохранить</button>
        </div>
      </div>

      <div class="set">
        <h4>Уведомления в Telegram</h4>
        ${!tg.token ? `<p class="muted small">Не настроено. Как включить — в инструкции (server/README.md): создать бота в @BotFather и добавить его токен в Cloudflare как секрет <b>TG_TOKEN</b>.</p>`
          : tg.linked ? `<p class="muted small">Подключено ✅ Приходят: первый вход по коду, попытки войти на другом телефоне, отключённым или просроченным кодом, перебор кодов.</p>
              <button class="btn tonal" data-s="tg-unlink">Отключить уведомления</button>`
          : `<p class="muted small">Открой своего бота в Telegram, нажми «Start» (или напиши ему любое сообщение), потом нажми кнопку ниже.</p>
              <button class="btn primary" data-s="tg-link">Подключить Telegram</button>`}
      </div>
    </details>`;
  }

  function render() {
    const hasOwner = items.some((i) => i.owner);
    const week = Date.now() - 7 * DAY;
    const n = {
      all: items.length,
      active: items.filter((i) => i.active && i.device && !isExpired(i)).length,
      week: items.filter((i) => i.lastSeen && i.lastSeen > week).length,
      off: items.filter((i) => !i.active || isExpired(i)).length,
    };

    root.innerHTML = `
      <div class="row-between"><h1 class="page-title">Коды доступа</h1><button class="link" id="logout">Выйти</button></div>
      ${created ? `<div class="newcode">
          <div class="lbl2">Код для «${esc(created.name)}»</div>
          <div class="big">${esc(created.code)}</div>
          <div class="btn-row"><button class="btn primary" data-a="invite" data-c="${esc(created.code)}">Копировать приглашение</button></div>
        </div>` : ''}
      <div class="stats">
        <div class="stat"><b>${n.all}</b><span>всего</span></div>
        <div class="stat"><b>${n.active}</b><span>активны</span></div>
        <div class="stat"><b>${n.week}</b><span>за неделю</span></div>
        <div class="stat"><b>${n.off}</b><span>закрыты</span></div>
      </div>
      <section class="card">
        <div class="card-head"><h3>Новый код</h3></div>
        <input class="field" id="name" placeholder="Имя, например: Шеф" maxlength="60">
        <input class="field" id="note" placeholder="Заметка (необязательно)" maxlength="200">
        <label class="lbl">Действует до (необязательно)</label>
        <input class="field" id="exp" type="date" min="${isoDate(Date.now())}">
        ${hasOwner ? '' : `<label class="check"><input type="checkbox" id="owner" checked> Это мой код (владелец, нельзя отключить)</label>`}
        <p class="err" id="err"></p>
        <button class="btn primary" id="create">Создать код</button>
      </section>
      ${settingsHtml()}
      <p class="muted">
        <b>Отключить</b> — закрыть доступ (сработает при следующем запуске приложения с интернетом).<br>
        <b>Срок</b> — код сам перестанет работать после выбранной даты.<br>
        <b>Сменить код</b> — старый код перестаёт работать, человек получает новый.<br>
        <b>Отвязать телефон</b> — если человек сменил телефон: он вводит тот же код на новом.</p>
      ${items.length > 3 ? `<input class="field" id="search" type="search" placeholder="Поиск по имени, заметке или коду" value="${esc(query)}">` : ''}
      <div id="list" style="display:flex;flex-direction:column;gap:12px">${listHtml()}</div>`;

    document.getElementById('settings').ontoggle = (e) => { settingsOpen = e.target.open; };
    const search = document.getElementById('search');
    if (search) search.oninput = () => { query = search.value; document.getElementById('list').innerHTML = listHtml(); };
    document.getElementById('logout').onclick = () => { sessionStorage.removeItem('admin-pass'); pass = ''; created = null; renderLogin(); };
    document.getElementById('create').onclick = async () => {
      const name = document.getElementById('name').value.trim();
      const note = document.getElementById('note').value.trim();
      const expV = document.getElementById('exp').value;
      const ownerBox = document.getElementById('owner');
      if (!name) { document.getElementById('err').textContent = 'Впиши имя'; return; }
      const owner = ownerBox ? ownerBox.checked : false;
      try {
        const r = await call('/admin/create', 'POST', { name, note, owner, expires: !owner && expV ? parseDate(expV) : null });
        created = r.item;
        await load();
        window.scrollTo(0, 0);
      } catch (e) { document.getElementById('err').textContent = 'Не получилось создать код'; }
    };
  }

  async function saveCfg(data, msg) {
    try { await call('/admin/config', 'POST', data); await load(); toast(msg || 'Сохранено'); }
    catch (e) { toast('Ошибка'); }
  }

  root.addEventListener('click', async (ev) => {
    const s = ev.target.closest('[data-s]');
    if (s) {
      const v = (id) => document.getElementById(id).value.trim();
      switch (s.dataset.s) {
        case 'msg-save':
          if (!v('msg')) { toast('Впиши текст'); return; }
          return saveCfg({ msg: v('msg') }, 'Объявление показано');
        case 'msg-clear': return saveCfg({ msg: '' }, 'Объявление убрано');
        case 'apk-save': {
          const code = parseInt(v('apk-code'), 10) || 0;
          if (!code || !v('apk-name') || !/^https?:\/\//.test(v('apk-url'))) { toast('Заполни версию, номер и ссылку'); return; }
          const force = document.getElementById('apk-force').checked;
          const keepMin = cfg && cfg.minApk && cfg.minApk < code ? cfg.minApk : 0;
          return saveCfg({ apk: { code, name: v('apk-name'), url: v('apk-url') }, minApk: force ? code : keepMin });
        }
        case 'offline-save': return saveCfg({ offlineDays: v('offline') });
        case 'tg-link':
          try { await call('/admin/tg-link', 'POST', {}); await load(); toast('Telegram подключён'); }
          catch (e) {
            alert(e.message === 'no_messages' ? 'Бот не видит твоих сообщений. Открой бота в Telegram, нажми Start и попробуй снова.'
              : e.message === 'bad_token' ? 'Токен бота неверный. Проверь секрет TG_TOKEN в Cloudflare.' : 'Не получилось подключить');
          }
          return;
        case 'tg-unlink':
          if (!confirm('Отключить уведомления в Telegram?')) return;
          try { await call('/admin/tg-unlink', 'POST', {}); await load(); toast('Отключено'); } catch (e) { toast('Ошибка'); }
          return;
      }
      return;
    }

    const b = ev.target.closest('[data-a]');
    if (!b) return;
    const code = b.dataset.c, action = b.dataset.a;
    const it = items.find((i) => i.code === code) || created;
    if (action === 'invite') { copy(invite(it)); return; }
    if (action === 'regen') {
      if (!confirm(`Выдать «${it.name}» новый код? Старый код ${it.code} сразу перестанет работать, человеку нужно будет ввести новый.`)) return;
      try {
        const r = await call('/admin/update', 'POST', { code, action: 'regen' });
        created = { ...it, code: r.code };
        await load();
        window.scrollTo(0, 0);
        toast('Новый код создан');
      } catch (e) { toast('Ошибка'); }
      return;
    }
    if (action === 'rename') {
      const name = (prompt('Новое имя:', it.name) || '').trim();
      if (!name || name === it.name) return;
      try {
        await call('/admin/update', 'POST', { code, action: 'rename', name });
        if (created && created.code === code) created.name = name;
        await load();
        toast('Имя изменено');
      } catch (e) { toast('Ошибка'); }
      return;
    }
    if (action === 'note') {
      const note = prompt('Заметка (видишь только ты). Пусто — убрать:', it.note || '');
      if (note === null) return;
      try { await call('/admin/update', 'POST', { code, action: 'note', note: note.trim() }); await load(); toast('Сохранено'); }
      catch (e) { toast('Ошибка'); }
      return;
    }
    if (action === 'expires') {
      const cur = it.expires ? dateOnly(it.expires) : '';
      const s2 = prompt('До какого дня действует код? Формат ДД.ММ.ГГГГ, например 31.12.2026.\nПусто — без срока.', cur);
      if (s2 === null) return;
      const expires = s2.trim() ? parseDate(s2) : null;
      if (s2.trim() && !expires) { alert('Не понял дату. Напиши, например, 31.12.2026'); return; }
      try { await call('/admin/update', 'POST', { code, action: 'expires', expires }); await load(); toast(expires ? `Действует до ${dateOnly(expires)}` : 'Без срока'); }
      catch (e) { toast('Ошибка'); }
      return;
    }
    const ask = {
      disable: `Отключить доступ для «${it.name}»?`,
      delete: `Удалить код «${it.name}» навсегда? Его копия записей на сервере тоже удалится.`,
      unbind: `Отвязать телефон от кода «${it.name}»? Старый телефон потеряет доступ, код можно будет ввести на новом.`,
    }[action];
    if (ask && !confirm(ask)) return;
    try {
      await call('/admin/update', 'POST', { code, action });
      if (created && created.code === code && action === 'delete') created = null;
      await load();
      toast('Готово');
    } catch (e) { toast('Ошибка'); }
  });

  if (pass) load().catch(() => renderLogin());
  else renderLogin();
  </script>
</body>
</html>
